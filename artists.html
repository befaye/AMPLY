<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artists | AMPLY</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="artists-page">

  <header>
    <div class="container header-flex">
      <div class="logo-nav-group">
        <div class="logo-container">
          <a href="index.html" class="logo-link">
            <img src="assets/white-transp-logo.png" alt="AMPLY Logo" class="logo-img" />
            <h1 class="logo">AMPLY</h1>
          </a>
        </div>
        <nav class="main-nav">
          <a href="artists.html" class="nav-link">Artists</a>
          <a href="events.html" class="nav-link">Events</a>
        </nav>
      </div>

      <div class="auth-buttons">
        <a href="login.html?view=register">
          <button>Sign Up</button>
        </a>
        <a href="login.html?view=login">
          <button>Log In</button>
        </a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <h2 class="section-title">ARTISTS</h2>
    <div class="artist-grid" id="artist-container">
      <p id="loading-message">Loading artists...</p>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const possiblePaths = [
        'all-artists.json',
        './all-artists.json',
        'data/all-artists.json',
        '../all-artists.json'
      ];
      
      let attempts = 0;
      
      function tryFetch(pathIndex) {
        if (pathIndex >= possiblePaths.length) {
          showError();
          return;
        }
        
        fetch(possiblePaths[pathIndex])
          .then(response => {
            if (!response.ok) throw new Error('Not found');
            return response.json();
          })
          .then(artists => {
            displayArtists(artists);
          })
          .catch(error => {
            console.log(`Tried ${possiblePaths[pathIndex]}, failed. Trying next path...`);
            tryFetch(pathIndex + 1);
          });
      }
      
      function displayArtists(artists) {
        const container = document.getElementById('artist-container');
        container.innerHTML = '';
        
        artists.forEach(artist => {
          const card = document.createElement('div');
          card.className = 'artist-card';
          
          // Handle potential missing image
          const imageHTML = artist.image 
            ? `<img src="${artist.image}" alt="${artist.name}" onerror="this.src='assets/default-artist.jpg'">`
            : '<div class="missing-image">No Image</div>';
          
          card.innerHTML = `
            <div class="profile-pic">
              ${imageHTML}
            </div>
            <h3 class="artist-name">${artist.name}</h3>
            <p><strong>${artist.type}</strong></p>
            <p><strong>${artist.genre}</strong></p>
            <p class="artist-desc">${artist.bio}</p>
            <button class="view-btn">View Artist</button>
          `;
          container.appendChild(card);
        });
      }
      
      function showError() {
        const container = document.getElementById('artist-container');
        container.innerHTML = `
          <div class="error-message">
            <p>Couldn't load artists. Please check:</p>
            <ul>
              <li>Is the JSON file in the correct location?</li>
              <li>Are you running this through a local server?</li>
              <li>Check browser console for details (F12)</li>
            </ul>
            <button onclick="window.location.reload()">Try Again</button>
          </div>
        `;
      }
      
      // Start trying to fetch
      tryFetch(0);
    });

    function viewArtist(id) {
      window.location.href = `artist-detail.html?id=${id}`;
    }
  </script>
</body>
</html>
