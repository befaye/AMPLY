<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artist Profile | AMPLY</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="artist-profile-page">

  <header>
    <div class="container header-flex">
      <div class="logo-nav-group">
        <div class="logo-container">
          <a href="index.html" class="logo-link">
            <img src="assets/white-transp-logo.png" alt="AMPLY Logo" class="logo-img" />
            <h1 class="logo">AMPLY</h1>
          </a>
        </div>
        <nav class="main-nav">
          <a href="artists.html" class="nav-link">Artists</a>
          <a href="events.html" class="nav-link">Events</a>
        </nav>
      </div>

      <div class="auth-buttons">
        <a href="login.html?view=register">
          <button>Sign Up</button>
        </a>
        <a href="login.html?view=login">
          <button>Log In</button>
        </a>
      </div>
    </div>
  </header>

  <a href="artists.html" class="back-btn">← Back to Artists</a>
    <div class="cover-photo profile-cover" id="cover-photo"></div>

  <main class="profile-details">
  <div class="container">
    <div class="top-section">
      <img id="pfp-img" class="pfp-img profile-pfp" alt="Profile Picture"/>
      <div class="basic-info profile-basic-info">
        <h2 id="artist-name"></h2>
        <p id="artist-type"></p>
        <p id="artist-genre"></p>
        <p id="artist-location" class="location profile-location"></p>
        <div class="members-wrapper">
          <div id="members-section"></div>
        </div>
      </div>
    </div>
  </div>
    <div class="profile-info-box" id="socials-section"></div>
    <div class="profile-info-box" id="contact-section"></div>

    <div class="profile-info-box">
        <h3>Gallery</h3>
        <div class="gallery-grid" id="artist-gallery"></div>
    </div>

    <div class="profile-info-box">
        <h3>Highlight Video</h3>
        <div class="highlight-video" id="artist-video"></div>
    </div>
    </main>

  <script src="artists-script.js"></script>
</body>
</html>
